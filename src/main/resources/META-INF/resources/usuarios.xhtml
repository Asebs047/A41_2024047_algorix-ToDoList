<!DOCTYPE html>
<h:html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:f="http://xmlns.jcp.org/jsf/core"
        xmlns:p="http://primefaces.org/ui">
    <h:head>
        <title>Usuarios - To Do List 2024047</title>

        <!-- Estilos -->
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/primeflex.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeflex@latest/themes/primeone-dark.css"/>
        <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    </h:head>

    <h:body styleClass="flex flex-column min-h-screen justify-content-between">

        <!-- Título centrado -->
        <div class="text-center mt-6 mb-4">
            <h1 class="text-4xl font-bold text-white">Gestión de Usuarios</h1>
            <h3 class="text-xl text-teal-300 mt-2">Algorix - 2024047</h3>
        </div>

        <!-- Contenido principal -->
        <div class="flex justify-content-center flex-grow-1 px-4">
            <h:form id="formulario-usuarios" styleClass="w-full md:w-10 lg:w-8 xl:w-6">

                <!-- Mensajes -->
                <p:growl id="mensaje_emergente" showDetail="true" life="3000" />

                <!-- Barra de menús -->
                <p:menubar styleClass="mb-3 border-round shadow-2">
                    <p:menuitem value="Inicio" icon="pi pi-home"
                                update="tabla-usuarios"
                                actionListener="#{usuariosController.cargarDatos}"
                                onclick="location.href='index.xhtml'"/>
                    <p:menuitem value="Nuevo Usuario" icon="pi pi-user-plus"
                                update=":formulario-modal:ventana-usuario"
                                actionListener="#{usuariosController.agregarUsuario}"
                                oncomplete="PF('ventanaModalUsuario').show()" />
                </p:menubar>

                <!-- Tabla de usuarios -->
                <p:dataTable value="#{usuariosController.usuarios}" var="usuario" id="tabla-usuarios"
                             styleClass="shadow-2 border-round mb-4"
                             paginator="true" rows="5" responsiveLayout="scroll">

                    <f:facet name="header">
                        <div class="text-xl text-white text-center py-2">Listado de Usuarios</div>
                    </f:facet>

                    <p:column headerText="ID">
                        <h:outputText value="#{usuario.id_usuario}" />
                    </p:column>
                    <p:column headerText="Nombre">
                        <h:outputText value="#{usuario.nombre}" />
                    </p:column>
                    <p:column headerText="Apellido">
                        <h:outputText value="#{usuario.apellido}" />
                    </p:column>
                    <p:column headerText="Teléfono">
                        <h:outputText value="#{usuario.telefono}" />
                    </p:column>
                    <p:column headerText="Correo">
                        <h:outputText value="#{usuario.correo}" />
                    </p:column>
                    <p:column headerText="Password">
                        <h:outputText value="#{usuario.pass}" />
                    </p:column>

                    <!-- Botones -->
                    <p:column headerText="Opciones">
                        <p:commandButton icon="pi pi-pencil" title="Editar"
                                         class="ui-button-rounded ui-button-primary mr-2"
                                         update=":formulario-modal:ventana-usuario"
                                         process="@this"
                                         oncomplete="PF('ventanaModalUsuario').show()">
                            <f:setPropertyActionListener value="#{usuario}"
                                                         target="#{usuariosController.usuarioSeleccionado}" />
                            <p:resetInput target=":formulario-modal:ventana-usuario" />
                        </p:commandButton>

                        <p:commandButton icon="pi pi-trash" title="Eliminar"
                                         class="ui-button-rounded ui-button-danger"
                                         process="@this"
                                         oncomplete="PF('ventanaEliminarUsuario').show()">
                            <f:setPropertyActionListener value="#{usuario}"
                                                         target="#{usuariosController.usuarioSeleccionado}" />
                        </p:commandButton>
                    </p:column>
                </p:dataTable>
            </h:form>
        </div>

        <!-- Diálogo de usuario -->
        <h:form id="formulario-modal">
            <p:dialog header="Detalle del Usuario" showEffect="fade"
                      modal="true" widgetVar="ventanaModalUsuario" responsive="true">
                <p:outputPanel id="ventana-usuario" class="ui-fluid">
                    <div class="field">
                        <p:outputLabel for="nombre" value="Nombre" />
                        <p:inputText id="nombre" required="true"
                                     value="#{usuariosController.usuarioSeleccionado.nombre}" />
                    </div>
                    <div class="field">
                        <p:outputLabel for="apellido" value="Apellido" />
                        <p:inputText id="apellido"
                                     value="#{usuariosController.usuarioSeleccionado.apellido}" />
                    </div>
                    <div class="field">
                        <p:outputLabel for="telefono" value="Teléfono" />
                        <p:inputText id="telefono"
                                     value="#{usuariosController.usuarioSeleccionado.telefono}" />
                    </div>
                    <div class="field">
                        <p:outputLabel for="correo" value="Correo" />
                        <p:inputText id="correo" required="true"
                                     value="#{usuariosController.usuarioSeleccionado.correo}" />
                    </div>
                    <div class="field">
                        <p:outputLabel for="pass" value="Password" />
                        <p:inputText id="pass"
                                     value="#{usuariosController.usuarioSeleccionado.pass}" />
                    </div>
                </p:outputPanel>
                <f:facet name="footer">
                    <p:commandButton value="Guardar" icon="pi pi-check"
                                     class="ui-button-primary"
                                     process="ventana-usuario @this"
                                     update=":formulario-usuarios:tabla-usuarios"
                                     oncomplete="PF('ventanaModalUsuario').hide()"
                                     actionListener="#{usuariosController.guardarUsuario}" />
                    <p:commandButton value="Cancelar" icon="pi pi-times"
                                     class="ui-button-secondary"
                                     onclick="PF('ventanaModalUsuario').hide()" type="button" />
                </f:facet>
            </p:dialog>

            <!-- Confirmación de eliminación -->
            <p:confirmDialog widgetVar="ventanaEliminarUsuario" showEffect="fade"
                             width="300" message="¿Desea eliminar al usuario?"
                             header="Confirmación" severity="warn">
                <p:commandButton value="Sí" icon="pi pi-check" class="ui-button-primary"
                                 process="@this"
                                 actionListener="#{usuariosController.eliminarUsuario}"
                                 oncomplete="PF('ventanaEliminarUsuario').hide()" />
                <p:commandButton value="No" icon="pi pi-times" class="ui-button-secondary"
                                 onclick="PF('ventanaEliminarUsuario').hide()" type="button" />
            </p:confirmDialog>
        </h:form>

        <!-- Footer -->
        <footer class="text-center py-4 text-white">
            <p>Emiliano Herrera - 2024047</p>
            <p>Algorix</p>
        </footer>

    </h:body>
</h:html>
